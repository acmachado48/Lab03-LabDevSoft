<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Sistema de Mérito</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/cadastro-aluno.css">
</head>
<body>
    <div class="auth-container auth-container-sm">
        <!-- Toast de Notificação -->
        <div id="toast" class="toast hidden"></div>

        <div class="auth-card">
            <div class="auth-header">
                <h2>Sistema de Mérito</h2>
                <p>Entre com sua conta para acessar seu painel</p>
            </div>

            <form id="form-login">
                <div class="form-grid form-grid-single">
                    <div class="form-group">
                        <label>Login ou E-mail</label>
                        <input type="text" id="login" autocomplete="username" required>
                        <span class="error-msg" id="erro-login"></span>
                    </div>

                    <div class="form-group">
                        <label>Senha</label>
                        <input type="password" id="senha" autocomplete="current-password" required>
                        <span class="error-msg" id="erro-senha"></span>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary btn-block">Entrar</button>
                    <a href="cadastro-aluno.html" class="link-voltar">É aluno e ainda não tem conta? Cadastre-se</a>
                    <br>
                    <a href="admin.html" class="link-voltar link-discreto">Acesso administrativo</a>
                </div>
            </form>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
