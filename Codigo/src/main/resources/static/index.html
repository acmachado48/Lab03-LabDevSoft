<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Empresa Parceira</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Cadastro de Empresa Parceira</h2>
        
        <!-- Área para mensagens globais (sucesso ou conflitos de regra de negócio) -->
        <div id="mensagem-global" class="mensagem"></div>

        <form id="form-empresa">
            <div class="form-group">
                <label for="nome">Razão Social:</label>
                <input type="text" id="nome" name="nome" required>
                <span class="erro-campo" id="erro-nome"></span>
            </div>

            <div class="form-group">
                <label for="cnpj">CNPJ (Apenas números):</label>
                <input type="text" id="cnpj" name="cnpj" maxlength="14" required>
                <span class="erro-campo" id="erro-cnpj"></span>
            </div>

            <div class="form-group">
                <label for="telefone">Telefone:</label>
                <input type="text" id="telefone" name="telefone">
                <span class="erro-campo" id="erro-telefone"></span>
            </div>

            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>
                <span class="erro-campo" id="erro-email"></span>
            </div>

            <div class="form-group">
                <label for="login">Login:</label>
                <input type="text" id="login" name="login" required>
                <span class="erro-campo" id="erro-login"></span>
            </div>

            <div class="form-group">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required>
                <span class="erro-campo" id="erro-senha"></span>
            </div>

            <button type="submit">Cadastrar Empresa</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
