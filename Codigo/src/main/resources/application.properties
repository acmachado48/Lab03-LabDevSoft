spring.application.name=moeda

# Banco de dados H2 em arquivo (persiste entre execucoes, sem instalacao)
spring.datasource.url=jdbc:h2:file:./data/moeda
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Executa data.sql (dados iniciais) depois que o Hibernate cria as tabelas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Console web do H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
